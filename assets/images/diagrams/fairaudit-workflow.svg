<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img">
<rect width="1280" height="640" rx="28" fill="#0f172a"/>
<text x="48" y="55" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f8fafc">FairAudit: Causal Diagnosis and Targeted Mitigation</text>
<text x="48" y="88" font-family="Arial,sans-serif" font-size="16" fill="#94a3b8">Detailed two-stage framework for intersectional fairness auditing, causal explanation, mitigation, and validation.</text>
<rect x="35" y="125" width="1210" height="205" rx="22" fill="#131a31" stroke="#4c1d95" stroke-width="2"/><text x="60" y="158" font-family="Arial" font-size="16" font-weight="700" fill="#c4b5fd">STAGE 1 — DIAGNOSTIC AUDIT</text><rect x="55" y="185" width="195" height="105" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="55" y="185" width="7" height="105" rx="4" fill="#7c3aed"/><text x="77" y="219" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Dataset / Predictions</text><text x="77" y="247" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Model outputs and</text><text x="77" y="267" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">protected attributes</text><rect x="285" y="185" width="195" height="105" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="285" y="185" width="7" height="105" rx="4" fill="#7c3aed"/><text x="307" y="219" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Intersectional Groups</text><text x="307" y="247" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Construct protected</text><text x="307" y="267" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">subgroup intersections</text><rect x="515" y="185" width="195" height="105" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="515" y="185" width="7" height="105" rx="4" fill="#7c3aed"/><text x="537" y="219" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Disparity Measurement</text><text x="537" y="247" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Quantify subgroup</text><text x="537" y="267" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">fairness gaps</text><rect x="745" y="185" width="195" height="105" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="745" y="185" width="7" height="105" rx="4" fill="#7c3aed"/><text x="767" y="219" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Causal Shapley Analysis</text><text x="767" y="247" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Diagnose subgroup</text><text x="767" y="267" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">disparity drivers</text><rect x="975" y="185" width="195" height="105" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="975" y="185" width="7" height="105" rx="4" fill="#7c3aed"/><text x="997" y="219" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Structured Audit Report</text><text x="997" y="247" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Record feature effects</text><text x="997" y="267" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">and interactions</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker></defs><line x1="250" y1="237" x2="285" y2="237" stroke="#60a5fa" stroke-width="3.5" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker></defs><line x1="480" y1="237" x2="515" y2="237" stroke="#60a5fa" stroke-width="3.5" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker></defs><line x1="710" y1="237" x2="745" y2="237" stroke="#60a5fa" stroke-width="3.5" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker></defs><line x1="940" y1="237" x2="975" y2="237" stroke="#60a5fa" stroke-width="3.5" marker-end="url(#arr)"/><rect x="35" y="365" width="1210" height="190" rx="22" fill="#10251f" stroke="#065f46" stroke-width="2"/><text x="60" y="398" font-family="Arial" font-size="16" font-weight="700" fill="#6ee7b7">STAGE 2 — TARGETED MITIGATION &amp; VALIDATION</text><rect x="170" y="430" width="200" height="100" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="170" y="430" width="7" height="100" rx="4" fill="#059669"/><text x="192" y="464" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Targeted Constraints</text><text x="192" y="492" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Subgroup-specific</text><text x="192" y="512" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">mitigation informed</text><text x="192" y="532" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">by the audit</text><rect x="475" y="430" width="200" height="100" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="475" y="430" width="7" height="100" rx="4" fill="#059669"/><text x="497" y="464" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Model Adjustment</text><text x="497" y="492" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Apply mitigation /</text><text x="497" y="512" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">retrain or adjust</text><rect x="780" y="430" width="200" height="100" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="780" y="430" width="7" height="100" rx="4" fill="#059669"/><text x="802" y="464" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Post-Mitigation Audit</text><text x="802" y="492" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Recompute disparity</text><text x="802" y="512" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">and predictive utility</text><rect x="1050" y="430" width="165" height="100" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="1050" y="430" width="7" height="100" rx="4" fill="#059669"/><text x="1072" y="464" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Final Comparison</text><text x="1072" y="492" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Compare fairness</text><text x="1072" y="512" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">and model utility</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker></defs><line x1="370" y1="480" x2="475" y2="480" stroke="#60a5fa" stroke-width="3.5" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker></defs><line x1="675" y1="480" x2="780" y2="480" stroke="#60a5fa" stroke-width="3.5" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker></defs><line x1="980" y1="480" x2="1050" y2="480" stroke="#60a5fa" stroke-width="3.5" marker-end="url(#arr)"/><defs><marker id="fa1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker></defs><path d="M 1070 290 C 1070 340, 270 340, 270 430" fill="none" stroke="#a78bfa" stroke-width="3.5" marker-end="url(#fa1)"/>






