<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630" role="img">
<rect width="1280" height="630" rx="28" fill="#0f172a"/>
<text x="48" y="55" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f8fafc">Machine Vision + IoT Sensing</text>
<text x="48" y="88" font-family="Arial,sans-serif" font-size="16" fill="#94a3b8">Multimodal architecture with parallel sensing streams, fusion, multiple analytics tasks, and edge deployment.</text>
<rect x="55" y="155" width="215" height="105" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="55" y="155" width="7" height="105" rx="4" fill="#0891b2"/><text x="77" y="189" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Vision Stream</text><text x="77" y="217" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Images / camera</text><text x="77" y="237" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">visual observations</text><rect x="55" y="390" width="215" height="105" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="55" y="390" width="7" height="105" rx="4" fill="#0891b2"/><text x="77" y="424" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">IoT Sensor Stream</text><text x="77" y="452" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Environmental and</text><text x="77" y="472" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">context signals</text><rect x="385" y="260" width="230" height="125" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="385" y="260" width="7" height="125" rx="4" fill="#0f766e"/><text x="407" y="294" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Multimodal Fusion</text><text x="407" y="322" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Align and combine</text><text x="407" y="342" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">vision + sensor data</text><rect x="735" y="145" width="205" height="110" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="735" y="145" width="7" height="110" rx="4" fill="#16a34a"/><text x="757" y="179" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Classification</text><text x="757" y="207" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Disease / object</text><text x="757" y="227" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">classification</text><rect x="735" y="305" width="205" height="110" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="735" y="305" width="7" height="110" rx="4" fill="#16a34a"/><text x="757" y="339" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Segmentation</text><text x="757" y="367" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Pixel-level visual</text><text x="757" y="387" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">segmentation</text><rect x="735" y="465" width="205" height="110" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="735" y="465" width="7" height="110" rx="4" fill="#16a34a"/><text x="757" y="499" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Monitoring</text><text x="757" y="527" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Integrated sensing</text><text x="757" y="547" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">and inference</text><rect x="1055" y="280" width="175" height="130" rx="18" fill="#111c33" stroke="#334155" stroke-width="2"/><rect x="1055" y="280" width="7" height="130" rx="4" fill="#f59e0b"/><text x="1077" y="314" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Edge Deployment</text><text x="1077" y="342" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Jetson Nano /</text><text x="1077" y="362" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Coral TPU</text><text x="1077" y="382" font-family="Arial,sans-serif" font-size="13.5" fill="#cbd5e1">real-time output</text><defs><marker id="v1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/></marker></defs><path d="M 270 207 C 330 207, 330 295, 385 310" fill="none" stroke="#60a5fa" stroke-width="3.5" marker-end="url(#v1)"/><defs><marker id="v2" v